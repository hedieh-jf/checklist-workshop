<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چک‌لیست تعاملی راه‌اندازی کارگاه کامپیوتر</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="app">
        <h1>🔧 چک‌لیست کارگاه کامپیوتر</h1>
        <div class="sub">سال تحصیلی جدید - وضعیت را به‌روز کن</div>

        <!-- نوار پیشرفت -->
        <div class="progress-wrap">
            <div id="progressBar"></div>
        </div>
        
        <!-- آمار -->
        <div class="stats">
            <span>✅ انجام‌شده: <span id="doneCount">0</span> از <span id="totalCount">0</span></span>
            <span>⏳ درصد پیشرفت: <span id="percentDisplay">۰</span>%</span>
        </div>

        <!-- محتوای چک‌لیست (توسط جاوااسکریپت ساخته می‌شود) -->
        <div id="stagesContainer"></div>

        <!-- دکمه‌های عملیاتی -->
        <div class="action-buttons">
            <button class="btn-green" onclick="resetAll(false)">🔄 ریست (همه ناتیک)</button>
            <button class="btn-blue" onclick="resetAll(true)">✅ تیک همه</button>
            <button onclick="saveToLocal()">💾 ذخیره در مرورگر</button>
            <button onclick="window.print()">🖨️ پرینت چک‌لیست</button>
        </div>

        <!-- جدول مشخصات سخت‌افزار -->
        <div class="hardware-table">
            <h3>📋 دفترچه مشخصات سیستم‌ها (قابل ویرایش)</h3>
            <table id="hwTable">
                <thead>
                    <tr>
                        <th>شماره</th>
                        <th>مدل</th>
                        <th>رم (GB)</th>
                        <th>هارد (GB)</th>
                        <th>سیستم‌عامل</th>
                        <th>وضعیت</th>
                    </tr>
                </thead>
                <tbody id="hwBody">
                    <!-- ردیف‌ها توسط جاوااسکریپت ساخته می‌شوند -->
                </tbody>
            </table>
            <div style="margin-top:10px; display:flex; gap:10px; justify-content:center;">
                <button class="btn-blue" onclick="addRow()">➕ افزودن سیستم</button>
                <button onclick="saveHardware()">💾 ذخیره جدول</button>
            </div>
        </div>
        
        <div class="print-hint">📌 برای چاپ، از گزینه پرینت مرورگر استفاده کن (Ctrl+P)</div>
    </div>

    <script src="script.js"></script>
</body>
  </html>
